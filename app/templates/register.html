{% extends "base.html" %}
{% block title %}Cadastro — Catálogo Tom Hanks{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h1>📝 Criar Conta</h1>
        <p class="subtitle">Cadastre-se para explorar os filmes de Tom Hanks</p>

        {% if error %}
        <div class="alert alert-error">⚠️ {{ error }}</div>
        {% endif %}

        <form method="POST" action="/register">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Criar Conta</button>
        </form>

        <div class="auth-footer">
            Já tem conta? <a href="/login">Faça login</a>
        </div>
    </div>
</div>
{% endblock %}
