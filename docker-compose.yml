services:
  catalog-service:
    build: .
    image: lebron057/catalog-service:latest
    container_name: catalog-service-iago
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth-service:8001}
      - LOG_SERVICE_URL=${LOG_SERVICE_URL:-http://log-service:8002}
      # Garage — acesso interno (o catalog-service proxy as imagens)
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-garage:9000}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-avatars}
    depends_on:
      - auth-service
      - log-service
      - garage
    networks:
      - internal-net
    restart: unless-stopped

  auth-service:
    image: lebron057/auth-service:latest
    container_name: auth-service-iago
    command: ["uvicorn", "auth_service.main:app", "--host", "0.0.0.0", "--port", "8001"]
    expose:
      - "8001"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-2525}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM:-noreply@catalogofilmes.com}
      - LOG_SERVICE_URL=${LOG_SERVICE_URL:-http://log-service:8002}
    depends_on:
      - log-service
    networks:
      - internal-net
    restart: unless-stopped

  log-service:
    image: lebron057/log-service:latest
    container_name: log-service-iago
    command: ["uvicorn", "log_service.main:app", "--host", "0.0.0.0", "--port", "8002"]
    expose:
      - "8002"
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - redis
    networks:
      - internal-net
    restart: unless-stopped

  garage:
    image: alpine:latest
    container_name: garage-iago
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
      # Access Key ID deve ter formato GKxxxxxxxxxxxxxxxxxxxxxxxx (prefixo GK + 26 hex)
      - GARAGE_KEY_ID=${MINIO_ROOT_USER}
      - GARAGE_KEY_SECRET=${MINIO_ROOT_PASSWORD}
    command:
      - sh
      - -c
      - |
        apk add --no-cache wget
        wget -q https://garagehq.deuxfleurs.fr/_releases/v0.9.1/x86_64-unknown-linux-musl/garage -O /usr/local/bin/garage
        chmod +x /usr/local/bin/garage

        cat > /etc/garage.toml <<EOF
        metadata_dir = "/var/lib/garage/meta"
        data_dir = "/var/lib/garage/data"
        db_engine = "lmdb"
        replication_mode = "none"
        rpc_bind_addr = "[::]:3901"
        rpc_public_addr = "127.0.0.1:3901"
        rpc_secret = "$$GARAGE_RPC_SECRET"

        [s3_api]
        s3_region = "us-east-1"
        api_bind_addr = "[::]:9000"
        root_domain = ".s3.garage.localhost"
        path_style = true
        EOF

        garage server &
        sleep 8

        NODE_ID=$$(garage node id 2>/dev/null | head -n1 | cut -d@ -f1)
        garage layout assign -z dc1 -c 1G $$NODE_ID || true
        garage layout apply --version 1 || true

        # 'key import' aceita chave arbitrária somente com flag -n (nome) e --yes
        garage key import -n appkey --yes $$GARAGE_KEY_ID $$GARAGE_KEY_SECRET || true
        garage bucket create avatars || true
        garage bucket allow --read --write --key $$GARAGE_KEY_ID avatars || true

        wait
    expose:
      - "9000"
    ports:
      - "9050:9000"
    volumes:
      - garage-data:/var/lib/garage
    networks:
      - internal-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "garage -c /etc/garage.toml status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: redis-iago
    networks:
      - internal-net
    restart: unless-stopped
    volumes:
      - redis-data:/data

networks:
  internal-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.75.0.0/16

volumes:
  redis-data:
  garage-data: